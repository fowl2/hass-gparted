name: "GParted Web UI"
version: "1.0.0"
slug: "gparted_web"
description: "GParted Partition Manager with a Web UI. Format and manage physical drives."
arch:
  - amd64
  - aarch64
boot: manual
ports:
  "5800/tcp": 5800
webui: "http://[HOST]:[PORT:5800]"
map:
  - dev:rw
privileged:
  - SYS_ADMIN
  - SYS_RAWIO
full_access: true
apparmor: false
host_pid: true
